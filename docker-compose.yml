# Run the production Docker image locally with MySQL:
#   docker compose up --build
#   open http://localhost:8080
# Uses APP_KEY from your .env file. First time with demo data:
#   docker compose run --rm -e SEED_DEMO_DATA=true app true

services:
  app:
    build: .
    image: eduvers:local
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      PORT: 8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eduvers
      DB_USERNAME: eduvers
      DB_PASSWORD: secret
      DB_URL: ""
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eduvers
      MYSQL_USER: eduvers
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  uploads:
  dbdata:
